# Example cluster registry. Copy to config/clusters.yaml and point tokenFile/tokenEnv at SA tokens.
#
# Optional: cluster that holds app-level user prefs (SSH public keys as ConfigMaps
# in kmc-system). Defaults to the first cluster below. Override with env
# KMC_SETTINGS_CLUSTER.
# settingsCluster: prod-sjc1
#
# Operator IPAM / VLAN pools are cluster-scoped CRs (not this file):
#   kubectl apply -f deploy/controller/examples/ippool.yaml
#   kubectl apply -f deploy/controller/examples/vlanpool.yaml
clusters:
  - id: prod-sjc1
    displayName: prod-sjc1
    apiServer: https://kubernetes.sjc1.prod.kcloud.io:6443
    caData: 
    tokenFile: config/secrets/prod-sjc1.token
    # Optional: public S3 API base URL for Object Storage (ObjectBucketClaim) UI
    objectStorageEndpoint: https://s3.kcloud.io
    # Underlay CIDRs for dual-home Multus guests (pod NIC routes).
    # Required so KubeVirt port-forward / browser Terminal can reach guest :22.
    network:
      podCIDR: 10.95.0.0/16
      serviceCIDR: 10.96.0.0/12
      dnsIP: 10.96.0.10
    # Dev Boxes: Tailscale-reachable MetalLB SSH VIP + public Envoy OIDC IDE.
    # IDE hosts attach to Gateway external listener https (*.k8s.kcloud.io).
    # Each IDE box mints a Dex OAuth2Client CR (default namespace dex) and a
    # Secret in the VM namespace. Callers need create/delete on
    # oauth2clients.dex.coreos.com in that namespace
    # (see deploy/controller/rbac/user-devbox-oidc-example.yaml).
    # devbox:
    #   metallb:
    #     addressPool: internal
    #   envoy:
    #     gatewayName: external
    #     gatewayNamespace: envoy-gateway-system
    #     sectionName: https
    #     hostTemplate: "%name%-%namespace%.k8s.kcloud.io"
    #     oidc:
    #       issuer: https://dex.k8s.kcloud.io
    #       cookieDomain: kcloud.io
    #       scopes:
    #         - openid
    #         - profile
    #         - email
    #         - groups
  - id: homelab
    displayName: homelab
    apiServer: https://kubernetes.den1.kcloud.zone:6443
    caData: 
    tokenFile: config/secrets/homelab.token
    # Optional: enables VM/database metrics graphs on detail pages.
    # Prefer an in-cluster URL when kmc runs in the same cluster:
    #   http://kube-prometheus-stack-prometheus.monitoring.svc:9090
    # Cross-cluster: the edge-sso hostname works if kmc sends this cluster's
    # SA token as Bearer (allowlist kmc-system/kmc on the Prom/AM SecurityPolicy).
    prometheusUrl: https://prometheus.k8s.kcloud.zone
    # Optional: public S3 API base URL for Object Storage (ObjectBucketClaim) UI
    objectStorageEndpoint: https://s3.kcloud.zone
    # Underlay CIDRs for dual-home Multus guests (pod NIC routes).
    # Required so KubeVirt port-forward / browser Terminal can reach guest :22.
    network:
      podCIDR: 10.19.0.0/16
      serviceCIDR: 10.20.0.0/16
      dnsIP: 10.20.0.10
    # Dev Boxes: Tailscale-reachable MetalLB VIP + Envoy OIDC.
    # Hosts attach to Gateway listener https (*.k8s.kcloud.zone).
    # Each IDE box mints a Dex OAuth2Client CR (default namespace dex) and a
    # Secret in the VM namespace. Callers need create/delete on
    # oauth2clients.dex.coreos.com in that namespace
    # (see deploy/controller/rbac/user-devbox-oidc-example.yaml).
    # devbox:
    #   metallb:
    #     addressPool: internal
    #   envoy:
    #     gatewayName: internal
    #     gatewayNamespace: envoy-gateway-system
    #     sectionName: https
    #     hostTemplate: "%name%-%namespace%.k8s.kcloud.zone"
    #     oidc:
    #       issuer: https://dex.k8s.kcloud.zone
    #       cookieDomain: kcloud.zone
    #       scopes:
    #         - openid
    #         - profile
    #         - email
    #         - groups
