  names:
    kind: IPPool
    listKind: IPPoolList
    plural: ippools
    shortNames:
    - ippool
    singular: ippool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .spec.multusNetwork
      name: Network
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPPool is a cluster-scoped IPv4 allocation pool for Multus networks.
          Object name is the pool id (e.g. "public"), matching clusters.yaml ipPools[].id
          and IPAddress.spec.poolRef.name when kind is IPPool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IPPoolSpec defines a cluster-scoped IPv4 pool bound to a Multus network.
              Referenced by IPAddress.poolRef with kind "IPPool".
            properties:
              cidr:
                description: IPv4 CIDR for the pool (e.g. 74.82.62.0/27).
                minLength: 1
                type: string
              cni:
                description: Optional CNI template to materialize a Multus NAD in
                  tenant namespaces.
                properties:
                  bridge:
                    description: Linux bridge on hypervisors (e.g. br-external).
                    minLength: 1
                    type: string
                  type:
                    description: CNI plugin type (typically "bridge").
                    minLength: 1
                    type: string
                  vlan:
                    description: Optional 802.1Q VLAN id on the bridge.
                    format: int32
                    maximum: 4094
                    minimum: 1
                    type: integer
                required:
                - bridge
                - type
                type: object
              dns:
                description: DNS resolvers advertised to guests.
                items:
                  type: string
                type: array
              end:
                description: Optional allocation window end (IPv4) within the CIDR.
                type: string
              exclude:
                description: Addresses never allocated (routers, VIPs, etc.).
                items:
                  type: string
                type: array
              gateway:
                description: Default gateway for guest routes. Optional for pure-L2
                  pools.
                type: string
              interface:
                description: Guest interface name for netplan match (e.g. enp1s0).
                type: string
              multusNetwork:
                description: |-
                  Multus NetworkAttachmentDefinition this pool serves.
                  Accepts "bridge-external" or "namespace/bridge-external".
                minLength: 1
                type: string
              start:
                description: Optional allocation window start (IPv4) within the CIDR.
                type: string
            required:
            - cidr
            - multusNetwork
            type: object
