# Example IPAddress. Recommended name: address with dots replaced by dashes.
# Create races on the same name return HTTP 409 (allocation uniqueness).
apiVersion: kmc.ianunruh.com/v1alpha1
kind: IPAddress
metadata:
  name: 10-40-1-20
  namespace: default
  labels:
    kmc.ianunruh.com/address: "10.40.1.20"
    kmc.ianunruh.com/pool: app-net
spec:
  address: 10.40.1.20
  prefixLength: 24
  poolRef:
    kind: VPC
    name: app-net
  # claimRef:
  #   apiVersion: kubevirt.io/v1
  #   kind: VirtualMachine
  #   name: web-1
  #   namespace: default
  interface:
    mac: "02:00:00:00:01:20"
    hostname: web-1
