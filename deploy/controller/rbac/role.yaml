---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmc-controller
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - k8s.cni.cncf.io
  resources:
  - network-attachment-definitions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kmc.ianunruh.com
  resources:
  - floatingips
  - ipaddresses
  - ippools
  - portforwards
  - routers
  - vlanpools
  - vpcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kmc.ianunruh.com
  resources:
  - floatingips/finalizers
  - ipaddresses/finalizers
  - ippools/finalizers
  - portforwards/finalizers
  - routers/finalizers
  - vlanpools/finalizers
  - vpcs/finalizers
  verbs:
  - update
- apiGroups:
  - kmc.ianunruh.com
  resources:
  - floatingips/status
  - ipaddresses/status
  - ippools/status
  - portforwards/status
  - routers/status
  - vlanpools/status
  - vpcs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
