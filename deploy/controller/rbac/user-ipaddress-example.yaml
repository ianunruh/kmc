# Example Role for tenants that create VMs / claim Multus IPs via the console
# when KMC_IPADDRESS_CR=true. Bind this (or a ClusterRole) to your OIDC groups.
#
#   kubectl apply -f deploy/controller/rbac/user-ipaddress-example.yaml
#   # then RoleBinding subjects → your users/groups
#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmc-ipaddress-user
  labels:
    app.kubernetes.io/part-of: kmc
rules:
  - apiGroups: ["kmc.ianunruh.com"]
    resources: ["ipaddresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
