# Example RBAC so Dev Box creators can mint per-box Dex OAuth2Client CRs.
# Dex kubernetes storage only watches its own namespace (default `dex`).
#
#   kubectl apply -f deploy/controller/rbac/user-devbox-oidc-example.yaml
#   # bind to the same OIDC groups that can create HTTPRoutes
#
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kmc-devbox-oidc
  namespace: dex
  labels:
    app.kubernetes.io/part-of: kmc
rules:
  - apiGroups: ["dex.coreos.com"]
    resources: ["oauth2clients"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
