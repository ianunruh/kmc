apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmc-controller
  namespace: kmc-system
  labels:
    app.kubernetes.io/name: kmc-controller
    app.kubernetes.io/part-of: kmc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kmc-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kmc-controller
        app.kubernetes.io/part-of: kmc
    spec:
      serviceAccountName: kmc-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/ianunruh/kmc-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
