apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmc-controller
  namespace: kmc-system
  labels:
    app.kubernetes.io/name: kmc-controller
    app.kubernetes.io/part-of: kmc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kmc-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kmc-controller
        app.kubernetes.io/part-of: kmc
    spec:
      serviceAccountName: kmc-controller
      securityContext:
        # distroless/static:nonroot uses UID/GID 65532; kubelet requires a
        # numeric runAsUser when runAsNonRoot is set (named "nonroot" is not enough).
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/ianunruh/kmc-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            # Required for Router appliance cloud-init (pod NIC routes to apiserver).
            # Match your cluster CNI / service range (example values).
            - --cluster-pod-cidrs=10.19.0.0/16
            - --cluster-service-cidrs=10.20.0.0/16
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
