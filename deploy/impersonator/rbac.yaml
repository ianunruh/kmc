apiVersion: v1
kind: Namespace
metadata:
  name: kmc-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kmc
  namespace: kmc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmc-impersonator
rules:
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["userextras"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmc-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kmc-impersonator
subjects:
  - kind: ServiceAccount
    name: kmc
    namespace: kmc-system
