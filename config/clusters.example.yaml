# Example cluster registry. Copy to config/clusters.yaml and point tokenFile/tokenEnv at SA tokens.
#
# Optional: cluster that holds app-level user prefs (SSH public keys as ConfigMaps
# in kmc-system). Defaults to the first cluster below. Override with env
# KMC_SETTINGS_CLUSTER.
# settingsCluster: prod-sjc1
clusters:
  - id: prod-sjc1
    displayName: prod-sjc1
    apiServer: https://kubernetes.sjc1.prod.kcloud.io:6443
    caData: 
    tokenFile: config/secrets/prod-sjc1.token
    # Optional: scan-derived IPv4 pools for Multus bridge networks.
    # On VM create, kmc picks a free address (from kmc.ianunruh.com/ipv4 annotations + live
    # VMI IPs), stamps annotations, and injects cloud-init networkData (netplan).
    ipPools:
      - id: public
        multusNetwork: bridge-external
        cidr: 74.82.62.0/27
        gateway: 74.82.62.1
        dns:
          - 1.1.1.1
          - 1.0.0.1
        # Optional: never allocate these (beyond network/broadcast/gateway)
        # exclude:
        #   - 74.82.62.2
        # Optional allocation window within the CIDR
        # start: 74.82.62.10
        # end: 74.82.62.200
        # Optional guest interface name for netplan (default: match virtio_net)
        # interface: enp1s0
    # Optional: VLAN pool for self-service VPCs (Multus bridge + vlan on hypervisors).
    # Create VPC in the UI allocates the next free VLAN and creates a namespace NAD.
    # vlanPools:
    #   - id: default
    #     start: 3000
    #     end: 3100
    #     bridge: br0
    #     dns: [1.1.1.1]
    #     # Never allocate these (hand-managed segments)
    #     exclude: [3000]
  - id: homelab
    displayName: homelab
    apiServer: https://kubernetes.den1.kcloud.zone:6443
    caData: 
    tokenFile: config/secrets/homelab.token
    # Optional: enables VM metrics graphs on the detail page
    prometheusUrl: https://prometheus.k8s.kcloud.zone
